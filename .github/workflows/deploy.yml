# Deploys everything from GitHub, with no local terminal.
#
#   Merge to main -> tests -> staging -> waits for your approval -> production
#                    (production: a backup before migrations, a health check
#                    10 minutes after)
#   Run workflow  -> one target, with optional admin, cron-secret and seed
#                    actions (production still waits for approval)
#
# To approve: open the run under Actions and press "Review deployments".
# The steps for each target are in deploy-target.yml.
#
# Secrets: SUPABASE_ACCESS_TOKEN (organization-wide), SUPABASE_PROJECT_REF
# and SUPABASE_DB_PASSWORD (production), STAGING_SUPABASE_PROJECT_REF and
# STAGING_SUPABASE_DB_PASSWORD (staging). Optional: SMTP_* / STAGING_SMTP_*,
# SENTRY_DSN, SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT. See README.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Project to deploy"
        type: choice
        options: [staging, production]
        default: staging
      admin_email:
        description: "Make this user an admin (they must have signed in to the app once)"
        required: false
      rotate_cron_secret:
        description: "Replace the cron secret (see runbook)"
        type: boolean
        default: false
      seed_staging:
        description: "Staging only: load fake units and catalog"
        type: boolean
        default: false
      skip_backup:
        description: "Production only: skip the backup before migrations (emergencies)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The whole CI suite on the commit being deployed. Nothing deploys unless
  # it passes. On pushes to main this is the only CI run.
  test:
    uses: ./.github/workflows/ci.yml

  staging:
    needs: test
    if: github.event_name == 'push' || inputs.target == 'staging'
    uses: ./.github/workflows/deploy-target.yml
    # Only the publish job inside uses it, to push to the site branch.
    permissions:
      contents: write
    # deploy-target.yml reads each secret by its full name.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      target: staging
      admin_email: ${{ inputs.admin_email || '' }}
      rotate_cron_secret: ${{ inputs.rotate_cron_secret == true }}
      seed_staging: ${{ inputs.seed_staging == true }}

  production:
    needs: [test, staging]
    # After a merge: once staging deployed. By hand: only when production was picked.
    if: >-
      always() && needs.test.result == 'success'
      && ((github.event_name == 'push' && needs.staging.result == 'success')
          || inputs.target == 'production')
    uses: ./.github/workflows/deploy-target.yml
    # Only the publish job inside uses it, to push to the site branch.
    permissions:
      contents: write
    # deploy-target.yml reads each secret by its full name.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      target: production
      admin_email: ${{ inputs.admin_email || '' }}
      rotate_cron_secret: ${{ inputs.rotate_cron_secret == true }}
      skip_backup: ${{ inputs.skip_backup == true }}
