# Deploys one project (staging or production): database migrations, Edge
# Functions, project settings, then the web app. Called by deploy.yml.
#
# Each run starts at the "approve" job, which carries the GitHub
# environment of the same name. Production's environment requires your
# approval (Settings, Environments, production, Required reviewers), so a
# production deploy waits there; staging's has no rules and goes straight on.
name: Deploy one target

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      admin_email:
        type: string
        default: ""
      rotate_cron_secret:
        type: boolean
        default: false
      seed_staging:
        type: boolean
        default: false
      skip_backup:
        type: boolean
        default: false

permissions:
  contents: read

# The account token reaches every project in the organization. It is set
# only on the jobs that call the Management API, never on a job that
# installs npm packages.
jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      prefix: ${{ steps.target.outputs.prefix }}
      base_path: ${{ steps.target.outputs.base_path }}
      configured: ${{ steps.target.outputs.configured }}
    steps:
      - id: target
        env:
          TARGET: ${{ inputs.target }}
          PRODUCTION_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          STAGING_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ "$TARGET" = production ]; then prefix=""; ref="$PRODUCTION_REF"; base="/$REPO/"
          else prefix="STAGING_"; ref="$STAGING_REF"; base="/$REPO/staging/"; fi
          if [ "$TARGET" = staging ] && [ -n "$ref" ] && [ "$ref" = "$PRODUCTION_REF" ]; then
            echo "::error::STAGING_SUPABASE_PROJECT_REF points at the production project"; exit 1
          fi
          configured=false
          if [ -n "$ref" ]; then configured=true
          else echo "::notice title=Deploy skipped::The $TARGET project is not configured yet (README, Environments)."; fi
          { echo "prefix=$prefix"; echo "base_path=$base"; echo "configured=$configured"; } >> "$GITHUB_OUTPUT"

  approve:
    needs: target
    if: needs.target.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    # A newer run supersedes one still waiting for approval, so approving
    # always deploys the latest main.
    concurrency:
      group: approve-${{ inputs.target }}
      cancel-in-progress: true
    steps:
      - run: echo "Deploying ${{ github.sha }} to ${{ inputs.target }}"

  backup:
    needs: approve
    if: inputs.target == 'production' && !inputs.skip_backup
    uses: ./.github/workflows/backup.yml
    secrets: inherit

  backend:
    needs: [target, approve, backup]
    # Runs once approved, when the backup succeeded or was skipped (staging, skip_backup).
    if: >-
      always() && needs.approve.result == 'success'
      && (needs.backup.result == 'success' || needs.backup.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: backend-${{ inputs.target }}
      cancel-in-progress: false
    outputs:
      anon_key: ${{ steps.anon.outputs.key }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DEPLOY_TARGET: ${{ inputs.target }}
      SUPABASE_PROJECT_REF: ${{ secrets[format('{0}SUPABASE_PROJECT_REF', needs.target.outputs.prefix)] }}
      SUPABASE_DB_PASSWORD: ${{ secrets[format('{0}SUPABASE_DB_PASSWORD', needs.target.outputs.prefix)] }}
      SITE_URL: https://${{ github.repository_owner }}.github.io${{ needs.target.outputs.base_path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          # An exact release: "latest" would run whatever was published last
          # with the account token. Also pinned in ci.yml.
          version: 2.120.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Apply database migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push

      - name: Deploy Edge Functions
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
          # Release tag and Sentry settings the functions report with.
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            APP_VERSION="$(git rev-parse --short HEAD)" SENTRY_ENVIRONMENT="$DEPLOY_TARGET" \
            ${SENTRY_DSN:+SENTRY_DSN="$SENTRY_DSN"}

      - name: Configure the project
        env:
          SMTP_HOST: ${{ secrets[format('{0}SMTP_HOST', needs.target.outputs.prefix)] }}
          SMTP_PORT: ${{ secrets[format('{0}SMTP_PORT', needs.target.outputs.prefix)] }}
          SMTP_USER: ${{ secrets[format('{0}SMTP_USER', needs.target.outputs.prefix)] }}
          SMTP_PASS: ${{ secrets[format('{0}SMTP_PASS', needs.target.outputs.prefix)] }}
          SMTP_SENDER: ${{ secrets[format('{0}SMTP_SENDER', needs.target.outputs.prefix)] }}
        run: node scripts/supabase-admin.mjs configure

      - name: Read the anon key
        # Public anyway (it ships in the bundle); passed on so the web build needs no token.
        id: anon
        run: echo "key=$(node scripts/supabase-admin.mjs anon-key)" >> "$GITHUB_OUTPUT"

      - name: Rotate the cron secret
        if: inputs.rotate_cron_secret
        run: node scripts/supabase-admin.mjs rotate-cron-secret

      - name: Seed staging
        if: inputs.seed_staging && inputs.target == 'staging'
        run: node scripts/supabase-admin.mjs seed-staging

      - name: Report project status
        # Counts and errors only: the repository is public.
        if: always()
        continue-on-error: true
        run: node scripts/supabase-admin.mjs status

      - name: Make admin
        if: inputs.admin_email != ''
        env:
          ADMIN_EMAIL: ${{ inputs.admin_email }}
        run: |
          # The run page is public: keep the address out of the log.
          echo "::add-mask::$ADMIN_EMAIL"
          node scripts/supabase-admin.mjs make-admin

  web:
    # Installs and runs npm packages, so it holds no Supabase token and
    # cannot write to the repository; install scripts never run.
    needs: [target, backend]
    if: always() && needs.backend.result == 'success'
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: ${{ inputs.target }}
      SUPABASE_PROJECT_REF: ${{ secrets[format('{0}SUPABASE_PROJECT_REF', needs.target.outputs.prefix)] }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        env:
          BASE_PATH: ${{ needs.target.outputs.base_path }}
          VITE_SUPABASE_ANON_KEY: ${{ needs.backend.outputs.anon_key }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ inputs.target }}
        run: |
          npm ci --ignore-scripts
          export VITE_SUPABASE_URL="https://$SUPABASE_PROJECT_REF.supabase.co"
          export VITE_APP_VERSION="$(git rev-parse --short HEAD)"
          export VITE_APP_BUILT_AT="$(git log -1 --format=%ct)"
          npm run build
          # built_at is the value for min_client_version (docs/runbook.md).
          echo "::notice title=Build::version $VITE_APP_VERSION built_at $VITE_APP_BUILT_AT"

      - name: Upload source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        # Run from outside web/ so npx cannot pick up a binary from the
        # build's node_modules.
        working-directory: ${{ runner.temp }}
        run: |
          [ -n "$SENTRY_AUTH_TOKEN" ] || { echo "no Sentry token; skipped"; exit 0; }
          dist="$GITHUB_WORKSPACE/web/dist"
          npx --yes @sentry/cli@3.8.2 sourcemaps inject "$dist"
          npx --yes @sentry/cli@3.8.2 sourcemaps upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" \
            --release "$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)" "$dist"

      - name: Drop source maps
        # They never reach the site branch or the public artifact.
        run: |
          find web/dist -name '*.map' -delete
          # Pages has no rewrites: unknown paths load the app via 404.html.
          cp web/dist/index.html web/dist/404.html

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-${{ inputs.target }}
          path: web/dist
          retention-days: 1

  publish:
    # The only job that can push, and it runs no npm code: it copies the
    # built files onto the site branch.
    needs: web
    if: always() && needs.web.result == 'success'
    runs-on: ubuntu-latest
    # Production and staging share the site branch; one publish at a time.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      DEPLOY_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-${{ inputs.target }}
          path: dist

      - name: Publish to the site branch
        # GitHub Pages serves the site branch: production at the root,
        # staging under staging/.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin site >/dev/null; then
            git fetch --depth 1 origin site
            git worktree add -B site site origin/site
          else
            git worktree add --orphan -b site site
          fi
          if [ "$DEPLOY_TARGET" = production ]; then
            rsync -a --delete --exclude staging/ --exclude .git --exclude .nojekyll dist/ site/
          else
            mkdir -p site/staging && rsync -a --delete dist/ site/staging/
          fi
          touch site/.nojekyll
          cd site
          git add -A
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -q -m "deploy $DEPLOY_TARGET $(git -C .. rev-parse --short HEAD)"
          git push origin site

  verify:
    # Production must still be healthy once the new build has run for a while.
    needs: publish
    if: always() && needs.publish.result == 'success' && inputs.target == 'production'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      HEALTH_TARGET: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: sleep 600
      - run: node scripts/supabase-admin.mjs health
