# Supabase pauses free projects after 7 days of low activity. Daily use
# prevents that; this covers quiet weeks.
name: Keepalive

on:
  schedule:
    - cron: "23 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -X POST -H "Content-Type: application/json" -d "{}" "$SUPABASE_URL/rest/v1/rpc/keepalive"
