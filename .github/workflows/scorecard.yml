# OpenSSF Scorecard: branch protection, pinned dependencies, token
# permissions and other repository hygiene, weekly and on pushes to main.
# Results show under Security, Code scanning.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21 # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@66e692051da0915b214c5158091a226015d453f4 # v3.38.3
        with:
          sarif_file: results.sarif
