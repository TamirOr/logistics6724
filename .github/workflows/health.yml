# Every 30 minutes: is the project up and healthy? Fails the run when a
# threshold in health_report() is crossed, and GitHub emails the failure to
# whoever last changed this schedule (the repository owner). Calling the
# database this often also keeps a free project from pausing; this replaces
# the old keepalive workflow.
#
# The repository is public, so the log shows check names and numbers only.
# What each failing check means and how to fix it: docs/runbook.md.
name: Health

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      HEALTH_TARGET: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Health report
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then echo "::notice::production is not configured"; exit 0; fi
          node scripts/supabase-admin.mjs health
