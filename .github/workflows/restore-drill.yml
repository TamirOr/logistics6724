# Restore drill: before launch and every quarter. Restores the newest
# production backup into a throwaway Postgres inside the runner, built from
# the migrations, and checks every table's row count against the dump. No
# Supabase project is touched, so real users never reach a copy of their
# data, and the copy is gone when the job ends.
#
# Before running: add the backup's private age key as the secret
# BACKUP_AGE_KEY (Settings, Secrets and variables, Actions). Delete that
# secret again when the run is done. Log the date in docs/runbook.md.
name: Restore drill

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The major version Supabase runs.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      BACKUP_TARGET: production
      AGE_KEY: ${{ secrets.BACKUP_AGE_KEY }}
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: drill
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Preconditions
        run: '[ -n "$AGE_KEY" ] || { echo "::error::Add the BACKUP_AGE_KEY secret first"; exit 1; }'

      - name: Install psql 17 and age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - name: Download and decrypt the newest backup
        run: |
          umask 077
          node scripts/drive.mjs download-latest backup.tar.gz.age
          printf '%s\n' "$AGE_KEY" > key.txt
          age --decrypt --identity key.txt backup.tar.gz.age | tar -xz
          rm key.txt
          echo "Backup taken at migration $(node -p 'require("./manifest.json").migration')"

      - name: Build the drill database from the migrations
        run: supabase/tests/schema.sh "$PGDATABASE"

      - name: Restore
        run: |
          node scripts/supabase-admin.mjs restore-scaffold data.sql > scaffold.sql
          psql --quiet --single-transaction -v ON_ERROR_STOP=1 \
            -f scaffold.sql -f supabase/restore/prepare.sql -f data.sql

      - name: Check row counts
        run: node scripts/supabase-admin.mjs verify-restore data.sql

      - name: Delete the decrypted files
        if: always()
        run: rm -f data.sql scaffold.sql manifest.json backup.tar.gz.age key.txt
