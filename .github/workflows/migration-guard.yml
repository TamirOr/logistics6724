# A pull request that adds a destructive migration (drop, rename, column
# type change, truncate) needs the db-breaking label (see docs/runbook.md).
# Its own workflow so adding or removing the label runs it again: a re-run
# of an earlier run would still see the labels that run started with.
name: Migration guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check new migrations
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          files=$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- 'supabase/migrations/*.sql')
          [ -z "$files" ] && { echo "no new migrations"; exit 0; }
          node scripts/migration-check.mjs "$LABELS" $files
